# Installs dependencies with uv and runs the test suite on every push/PR to main.

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: uv sync --all-groups
    - name: Test with pytest
      run: uv run pytest
