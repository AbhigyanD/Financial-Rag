# Local run: demo web UI + API on :8000; the older Streamlit UI on :8501.
#   cp .env.example .env   # add GROQ_API_KEY
#   docker compose up --build
services:
  api:
    build: .
    image: financial-rag
    env_file:
      - path: .env
        required: false # health check and UI still start without keys; queries will fail clearly
    ports:
      - "8000:8000"
    volumes:
      - rag-data:/data # vector store + embedding cache survive container restarts

  ui:
    image: financial-rag # same image as api, different command
    command: ["streamlit", "run", "streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s

volumes:
  rag-data:
