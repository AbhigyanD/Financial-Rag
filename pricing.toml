# ESTIMATES ONLY — used to label logged cost as an estimate, never as a bill.
# USD per 1 million tokens, standard rates (no batch discount, no prompt caching).
# Sources: Anthropic model pricing table (as cached 2026-10-06); OpenAI's
# published price for text-embedding-3-small. Verify current prices before
# quoting these numbers anywhere.

[llm."claude-opus-5"]
input_per_mtok = 5.00
output_per_mtok = 25.00

[llm."claude-opus-5-5"]
input_per_mtok = 4.00
output_per_mtok = 20.00

[llm."claude-sonnet-5-5"]
input_per_mtok = 2.00
output_per_mtok = 10.00

[llm."claude-haiku-5-5"]
input_per_mtok = 0.10
output_per_mtok = 0.50

# Groq models (default LLM_PROVIDER) are deliberately absent: prices could not
# be verified, and the free tier costs $0. Their cost is logged as null
# (unknown). Add a [llm."<GROQ_MODEL>"] entry if you move to a paid plan.

# Local embeddings run on your CPU: no per-token API cost.
[embedding."sentence-transformers/all-MiniLM-L6-v2"]
input_per_mtok = 0.0

[embedding."text-embedding-3-small"]
input_per_mtok = 0.02
