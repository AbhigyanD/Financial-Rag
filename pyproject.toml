[project]
name = "financial-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abhigyan Dey", email = "abhigyandey2@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "openai>=1.0",
    "chromadb>=0.5",
    "anthropic>=1.5.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "python-multipart>=0.0.32",
]

[project.scripts]
financial-rag = "financial_rag:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
